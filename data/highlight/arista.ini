; Arista EOS. The CLI is IOS-like, so this profile starts from the Cisco
; rules and replaces the ones that differ (rules with the same name win).

[profile]
name = arista
description = Arista EOS
inherits = cisco
detect = \bArista(?: Networks)?\b|\b(?:c|v)?EOS\b|Arista DCS-
detect = \(config-if-(?:Et|Ma|Po|Vl|Lo|Vx)\d

[rule.interface]
regex = \b(?:Ethernet|Et|Management|Ma|Port-Channel|Po|Vlan|Vl|Loopback|Lo|Vxlan|Vx|Tunnel|Tu|Recirc-Channel|Switch|Fabric|Dps)\d+(?:/\d+)*(?:\.\d+)?\b
fg = blue
priority = 50

[rule.mlag]
regex = \b(?:MLAG|mlag)\b|\bmlag-peer\b|\bpeer-link\b
fg = cyan
bold = true
priority = 55

[rule.eos-config-keyword]
regex = ^(?:(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?:\([^)\s]{1,40}\))?[>#]\s*)?\s*(?:no\s+)?(daemon|management|transceiver|platform|hardware|queue-monitor|sflow|ptp|mac|lldp|event-handler|peer-filter|router general|ip virtual-router)\b
group = 1
fg = cyan
bold = true
priority = 30
