; Juniper Junos (operational and configuration mode, set and hierarchy style).

[profile]
name = juniper
description = Juniper Junos
inherits = network-common
detect = \bJUNOS\b|\bJunos:|Juniper Networks|JUNOS Software Release
detect = ^\[edit(?:\s[^\]]*)?\]\s*$
detect = ^\{(?:master|backup|primary|secondary|linecard|hidden)(?::\d+)?\}\s*$
prompt = ^[\w.\-]+@[\w.\-]+[>#%]\s?$

; ---- Prompt and context ----------------------------------------------------

[rule.prompt-user-host]
regex = ^([\w.\-]+@[\w.\-]+)[>#%]
group = 1
fg = bright-green
bold = true
priority = 90

[rule.prompt-char]
regex = ^[\w.\-]+@[\w.\-]+([>#%])
group = 1
fg = bright-yellow
bold = true
priority = 90

[rule.edit-hierarchy]
regex = ^\[edit(?:\s[^\]]*)?\]
fg = yellow
bold = true
priority = 85

[rule.re-state]
regex = ^\{(?:master|backup|primary|secondary|linecard|hidden)(?::\d+)?\}
fg = magenta
bold = true
priority = 85

; ---- Interfaces ------------------------------------------------------------

[rule.interface]
regex = \b(?:(?:ge|xe|et|fe|mge|xle|ce|gr|ip|lt|vt|sp|si|ms|pd|pe|mt|lsq|ls)-\d+/\d+/\d+(?::\d+)?|(?:ae|lo|fxp|em|me|reth|fab|st|lsi|pp|vlan)\d+|irb|vme)(?:\.\d+)?\b
fg = blue
priority = 50

; ---- Configuration ---------------------------------------------------------

; Verbs may follow a prompt ("admin@mx1# set ...") or start a line ("show | display set").
[rule.set-verb]
regex = ^(?:[\w.\-]+@[\w.\-]+[>#%]\s*)?\s*(set|insert|rename|copy|annotate|activate|edit|top|up|commit)\b
group = 1
fg = cyan
bold = true
priority = 30

[rule.delete-verb]
regex = ^(?:[\w.\-]+@[\w.\-]+[>#%]\s*)?\s*(delete|deactivate)\b
group = 1
fg = red
bold = true
priority = 31

[rule.hierarchy]
regex = ^(?:[\w.\-]+@[\w.\-]+[>#%]\s*)?\s*(?:set|delete|deactivate|activate|edit)\s+(system|interfaces|protocols|policy-options|firewall|routing-options|routing-instances|security|snmp|vlans|chassis|class-of-service|forwarding-options|services|groups|apply-groups|event-options|access|switch-options|multi-chassis|bridge-domains|logical-systems|poe|ethernet-switching-options)\b
group = 1
fg = yellow
priority = 32

; "disable" statements turn things off: make them visible.
[rule.disable]
regex = \bdisable\b
fg = red
priority = 60

[rule.inactive]
regex = \binactive:\s
fg = red
priority = 60

[rule.commit-complete]
regex = \bcommit complete\b|\bconfiguration check succeeds\b
fg = green
bold = true
priority = 60

[rule.braces]
regex = [{};]
fg = bright-black
priority = 10

[rule.comment]
regex = ^\s*(?:#|/\*).*$
fg = bright-black
priority = 80

[rule.secret]
regex = \b(?:encrypted-password|secret|authentication-key|pre-shared-key|community)\s+"?([^";\s]+)
group = 1
fg = bright-red
underline = curly
priority = 70
