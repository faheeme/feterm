; Cisco IOS, IOS-XE, IOS-XR and NX-OS.
; detect = strong signal (switches profile in auto mode)
; prompt = weak signal (used only while no device has been detected yet)

[profile]
name = cisco
description = Cisco IOS, IOS-XE, IOS-XR, NX-OS
inherits = network-common
detect = Cisco (?:IOS|Nexus|Internetwork Operating System)|IOS-XE|IOS XR|NX-OS|cisco Systems, Inc
detect = ^RP/\d+/(?:RS?P)?\d*/CPU\d+:[\w.-]+(?:\([^)\s]{1,40}\))?#
prompt = ^[A-Za-z][\w.\-]{0,62}(?:\((?:config|cfg)[^)\s]{0,40}\))?[>#]\s?$

; ---- Prompt --------------------------------------------------------------

[rule.prompt-host]
regex = ^(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?=(?:\([^)\s]{1,40}\))?[>#])
fg = bright-green
bold = true
priority = 90

[rule.prompt-mode]
regex = ^(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(\([^)\s]{1,40}\))[>#]
group = 1
fg = yellow
priority = 90

[rule.prompt-char]
regex = ^(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?:\([^)\s]{1,40}\))?([>#])
group = 1
fg = bright-yellow
bold = true
priority = 90

; ---- Interfaces ----------------------------------------------------------

[rule.interface]
regex = \b(?:(?:Gigabit|TenGigabit|TwentyFiveGig|FortyGigabit|FiftyGig|HundredGig|TwoHundredGig|FourHundredGig|Fast|AppGigabit)?Ethernet|GigE|TenGigE|TwentyFiveGigE|FortyGigE|HundredGigE|FourHundredGigE|Gi|Te|Tw|Twe|Fo|Fa|Hu|Fh|Eth|Et|Port-channel|Po|Bundle-Ether|BE|Vlan|Vl|Loopback|Lo|Tunnel|Tu|Serial|Se|BDI|BVI|nve|Null|mgmt|MgmtEth|Mgmt|Dialer|Di|Virtual-Template|Virtual-Access|Cellular|Multilink|Mu|NVI|Ap)\d+(?:/\d+)*(?:[.:]\d+)?\b
fg = blue
priority = 50

; ---- Configuration -------------------------------------------------------

; Keywords may follow a prompt ("sw1(config)#interface Gi1/0/1") or start a line (show run).
[rule.config-keyword]
regex = ^(?:(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?:\([^)\s]{1,40}\))?[>#]\s*)?\s*(?:no\s+)?(interface|router|ip|ipv6|vlan|hostname|line|access-list|route-map|prefix-list|class-map|policy-map|crypto|aaa|username|enable|snmp-server|logging|ntp|spanning-tree|vrf|feature|neighbor|network|address-family|switchport|channel-group|service|banner|boot|license|key|track|standby|vrrp|hsrp|object-group|monitor|archive|control-plane|redundancy|description|bfd|evpn|mpls|segment-routing|multicast)\b
group = 1
fg = cyan
bold = true
priority = 30

[rule.config-no]
regex = ^(?:(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?:\([^)\s]{1,40}\))?[>#]\s*)?\s*(no)\s
group = 1
fg = red
bold = true
priority = 31

[rule.shutdown]
regex = ^(?:(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?:\([^)\s]{1,40}\))?[>#]\s*)?\s*(shutdown)\b
group = 1
fg = red
priority = 60

[rule.no-shutdown]
regex = ^(?:(?:RP/[\w/]+:)?[A-Za-z][\w.\-]{0,62}(?:\([^)\s]{1,40}\))?[>#]\s*)?\s*(no shutdown)\b
group = 1
fg = green
priority = 61

[rule.comment]
regex = ^\s*!.*$
fg = bright-black
priority = 80

; Routing table codes at the start of "show ip route" lines.
[rule.route-code]
regex = ^[LCSRBDOMEIi]\*?(?: (?:IA|E1|E2|N1|N2|L1|L2|EX|su))?\s+(?=\d{1,3}\.)
fg = cyan
bold = true
priority = 50

; Values that are secrets: underlined in red so they are noticed before sharing.
[rule.secret]
regex = \b(?:password|secret|key-string|key 7|community)\s+(?:[0-9]\s+)?(\S+)
group = 1
fg = bright-red
underline = curly
priority = 70
